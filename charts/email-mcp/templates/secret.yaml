{{- /* config.toml normally holds only env: references, but configToml may be
       supplied with inline credentials, so it lives in a Secret. */ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "email-mcp.fullname" . }}-config
  labels:
    {{- include "email-mcp.labels" . | nindent 4 }}
type: Opaque
stringData:
  config.toml: |
    {{- include "email-mcp.configToml" . | nindent 4 }}
{{- if not .Values.auth.existingSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "email-mcp.tokenSecretName" . }}
  labels:
    {{- include "email-mcp.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.auth.tokenKey }}: {{ required "set auth.existingSecret (recommended) or auth.token — the server refuses to listen on the network without a bearer token" .Values.auth.token | quote }}
{{- end }}
