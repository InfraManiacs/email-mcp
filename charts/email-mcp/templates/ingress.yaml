{{- $fullname := include "email-mcp.fullname" . -}}
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "email-mcp.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range splitList "," (include "email-mcp.publicPaths" $) }}
          - path: {{ . }}
            pathType: Prefix
            backend:
              service:
                name: {{ $fullname }}
                port:
                  name: http
          {{- end }}
    {{- end }}
{{- end }}
{{- if .Values.ingressRoute.enabled }}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ $fullname }}
  namespace: {{ .Values.ingressRoute.namespace | default .Release.Namespace }}
  labels:
    {{- include "email-mcp.labels" . | nindent 4 }}
spec:
  entryPoints:
    {{- toYaml .Values.ingressRoute.entryPoints | nindent 4 }}
  routes:
    - kind: Rule
      {{- $pathRules := list }}
      {{- range splitList "," (include "email-mcp.publicPaths" .) }}
      {{- $pathRules = append $pathRules (printf "PathPrefix(`%s`)" .) }}
      {{- end }}
      match: {{ printf "(%s) && (%s)" (include "email-mcp.hostMatch" .) (join " || " $pathRules) | quote }}
      {{- with .Values.ingressRoute.middlewares }}
      middlewares:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      services:
        - name: {{ $fullname }}
          namespace: {{ .Release.Namespace }}
          port: {{ .Values.service.port }}
  {{- with .Values.ingressRoute.tlsSecretName }}
  tls:
    secretName: {{ . }}
  {{- end }}
{{- end }}
