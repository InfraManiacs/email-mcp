name: hub-image

# Builds the fork's image (hub mode included) to GHCR for the Helm chart.
on:
  push:
    branches: [main, feat/oauth-hub]
    paths:
      - src/**
      - Dockerfile
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/hub-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: hub-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/inframaniacs/email-mcp
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=raw,value=hub,enable=${{ github.ref == 'refs/heads/main' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
